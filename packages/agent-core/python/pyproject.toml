[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-agent-core"
version = "0.1.0"
description = "Reusable Python/LangGraph runtime primitives for Aether commerce agents."
requires-python = ">=3.12"
dependencies = ["langgraph>=0.2.60"]

[tool.setuptools.packages.find]
where = ["src"]
