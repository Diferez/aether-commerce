name: AI assistant image

on:
  workflow_run:
    workflows: ["Aether CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_NAME: ghcr.io/diferez/aether-commerce-ai-assistant
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Build image
        working-directory: apps/ai-assistant
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            -t aether-ai-assistant:test .
      - name: Smoke image
        working-directory: apps/ai-assistant
        run: |
          docker run --rm -d --name aether-ai-assistant-smoke -p 8090:8090 \
            -e AETHER_API_BASE_URL=https://preview-api.invalid \
            -e AETHER_CART_TOKEN_SECRET=ci-cart-token-secret \
            -e DATABASE_URL= \
            -e REDIS_URL= \
            aether-ai-assistant:test
          trap 'docker stop aether-ai-assistant-smoke || true' EXIT
          python scripts/smoke.py
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        run: |
          docker tag aether-ai-assistant:test "${IMAGE_NAME}:${SOURCE_SHA}"
          docker tag aether-ai-assistant:test "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${SOURCE_SHA}"
          docker push "${IMAGE_NAME}:latest"
