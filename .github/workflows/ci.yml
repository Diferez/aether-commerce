name: Aether CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: aether-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch develop for changeset diverge-check
        # --update-head-ok: this workflow also runs on `push: branches: [develop]`,
        # where HEAD already *is* local branch develop - a plain fetch into that
        # same ref is refused ("refusing to fetch into current branch") without it.
        run: git fetch --update-head-ok origin develop:develop
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Secret scan
        run: |
          if git grep -n -I -E '(sk|rk)_(live|test)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|AIza[0-9A-Za-z_-]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'; then
            echo "::error::Potential live credential found in a tracked file."
            exit 1
          fi
      - name: Typecheck, lint, unit and contract tests, and OpenAPI
        run: pnpm validate
      - name: Verify release metadata
        run: pnpm changeset status
      - name: Validate LangGraph assistant
        run: |
          pnpm --filter @aether/ai-assistant typecheck
          pnpm --filter @aether/ai-assistant lint
          pnpm --filter @aether/ai-assistant test
          pnpm --filter @aether/ai-assistant build
      - name: Build workspace
        env:
          NEXT_PUBLIC_AETHER_API_URL: https://api.example.com
          NEXT_PUBLIC_AETHER_AI_URL: https://ai.example.com
          NEXT_PUBLIC_PORTFOLIO_URL: https://portfolio.example.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: pnpm build
      - name: Verify outputs
        run: |
          test -f apps/api/dist/index.js
          test -f apps/storefront/out/index.html
          test -f apps/admin/out/index.html
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
      - name: Assistant widget E2E
        run: pnpm test:e2e:assistant
