name: Aether CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: aether-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Secret scan
        run: |
          if git grep -n -I -E '(sk|rk)_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}' -- apps packages docs scripts; then
            echo "::error::Potential live credential found in a tracked file."
            exit 1
          fi
      - name: Typecheck, lint, unit and contract tests, and OpenAPI
        run: pnpm validate
      - name: Validate AI assistant
        working-directory: apps/ai-assistant
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: "."
        run: |
          python -m pip install --require-hashes -r requirements-docker.txt
          python -m compileall app tests scripts
          python scripts/security_scan.py
          python -m app.evaluation
          python scripts/acceptance_audit.py
          python tests/run_direct.py
      - name: Build and smoke AI assistant image
        working-directory: apps/ai-assistant
        run: |
          docker build -t aether-ai-assistant:test .
          docker run --rm -d --name aether-ai-assistant-smoke -p 8090:8090 \
            -e AETHER_API_BASE_URL=https://preview-api.invalid \
            -e AETHER_CART_TOKEN_SECRET=ci-cart-token-secret \
            -e DATABASE_URL= \
            -e REDIS_URL= \
            aether-ai-assistant:test
          trap 'docker stop aether-ai-assistant-smoke || true' EXIT
          python scripts/smoke.py
      - name: Build workspace
        env:
          NEXT_PUBLIC_AETHER_API_URL: https://api.example.com
          NEXT_PUBLIC_AETHER_AI_URL: https://ai.example.com
          NEXT_PUBLIC_PORTFOLIO_URL: https://portfolio.example.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: pnpm build
      - name: Verify outputs
        run: |
          test -f apps/api/dist/index.js
          test -f apps/storefront/out/index.html
          test -f apps/admin/out/index.html
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
      - name: Assistant widget E2E
        run: pnpm test:e2e:assistant
