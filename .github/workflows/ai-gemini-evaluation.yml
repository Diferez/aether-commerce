name: AI LangGraph canary evaluation

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum evaluation cases to run, capped by the script at 25"
        required: false
        default: "10"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ai-gemini-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    name: Limited real Worker evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_EVAL_MAX_CASES: ${{ github.event.inputs.limit || vars.AI_EVAL_MAX_CASES || '10' }}
      AETHER_AI_EVAL_URL: ${{ vars.AETHER_AI_EVAL_URL || vars.NEXT_PUBLIC_AETHER_AI_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run limited Gemini evaluation
        run: |
          if [ -z "${AETHER_AI_EVAL_URL}" ]; then
            echo "::error::AETHER_AI_EVAL_URL is required for the real Worker evaluation."
            exit 1
          fi
          node apps/ai-assistant/evaluation/run.mjs --limit "${AI_EVAL_MAX_CASES}"
