name: Deploy Aether production

on:
  workflow_run:
    workflows: ["Aether CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: aether-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ vars.APP_ORIGIN_STORE }}
    env:
      AETHER_DEPLOY_ENV: production
      CLOUDFLARE_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
      AI_TOOL_CALLING_ENABLED: ${{ vars.AI_TOOL_CALLING_ENABLED }}
      AI_MUTATIONS_ENABLED: ${{ vars.AI_MUTATIONS_ENABLED }}
      AETHER_API_WORKER_NAME: ${{ vars.AETHER_API_WORKER_NAME || 'aether-api' }}
      AETHER_AI_WORKER_NAME: ${{ vars.AETHER_AI_WORKER_NAME || 'aether-ai' }}
      AETHER_FRONT_WORKER_NAME: ${{ vars.AETHER_FRONT_WORKER_NAME || 'aether-storefront' }}
      AETHER_ADMIN_PAGES_PROJECT: ${{ vars.AETHER_ADMIN_PAGES_PROJECT || 'aether-admin' }}
      AETHER_D1_DATABASE_NAME: ${{ vars.AETHER_D1_DATABASE_NAME || 'aether-production' }}
      AETHER_D1_DATABASE_ID: ${{ vars.AETHER_D1_DATABASE_ID }}
      APP_ORIGIN_STORE: ${{ vars.APP_ORIGIN_STORE }}
      APP_ORIGIN_ADMIN: ${{ vars.APP_ORIGIN_ADMIN }}
      APP_STORE_BASE_PATH: ""
      NEXT_PUBLIC_AETHER_API_URL: ${{ vars.NEXT_PUBLIC_AETHER_API_URL }}
      NEXT_PUBLIC_AETHER_AI_URL: ${{ vars.NEXT_PUBLIC_AETHER_AI_URL }}
      NEXT_PUBLIC_PORTFOLIO_URL: ${{ vars.NEXT_PUBLIC_PORTFOLIO_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENABLED: ${{ vars.NEXT_PUBLIC_SENTRY_ENABLED }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AETHER_CART_TOKEN_SECRET: ${{ secrets.AETHER_CART_TOKEN_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_ISSUER: ${{ secrets.CLERK_JWT_ISSUER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_OPERATIONS_TOKEN: ${{ secrets.AI_OPERATIONS_TOKEN }}
        run: node scripts/check-deploy-runtime.mjs
      - name: Validate workspace
        run: pnpm validate
      - name: Build storefront, admin and Workers
        run: pnpm build
      - name: Generate production Worker configs
        run: |
          node scripts/write-api-wrangler-config.mjs
          node scripts/write-ai-wrangler-config.mjs
          node scripts/write-storefront-wrangler-config.mjs
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote --config apps/api/wrangler.production.json
      - name: Deploy API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config apps/api/wrangler.production.json
      - name: Configure API secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AETHER_CART_TOKEN_SECRET: ${{ secrets.AETHER_CART_TOKEN_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_ISSUER: ${{ secrets.CLERK_JWT_ISSUER }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_RECIPIENT_EMAIL: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENABLED: ${{ secrets.SENTRY_ENABLED }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
        run: |
          umask 077
          trap 'rm -f .api-secrets.json' EXIT
          node -e "const fs=require('fs'); const keys=['AETHER_CART_TOKEN_SECRET','CLERK_SECRET_KEY','CLERK_JWT_ISSUER','CLERK_WEBHOOK_SECRET','STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET','RESEND_API_KEY','CONTACT_RECIPIENT_EMAIL','CLOUDINARY_CLOUD_NAME','CLOUDINARY_API_KEY','CLOUDINARY_API_SECRET','GEMINI_API_KEY','SENTRY_DSN','SENTRY_ENABLED','SENTRY_ENVIRONMENT']; const out={}; for (const key of keys) if (process.env[key]) out[key]=process.env[key]; fs.writeFileSync('.api-secrets.json', JSON.stringify(out));"
          pnpm exec wrangler secret bulk .api-secrets.json --config apps/api/wrangler.production.json
      - name: Deploy AI assistant Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config apps/ai-assistant/wrangler.production.json --keep-vars
      - name: Configure AI assistant secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_OPERATIONS_TOKEN: ${{ secrets.AI_OPERATIONS_TOKEN }}
        run: |
          umask 077
          trap 'rm -f .ai-secrets.json' EXIT
          node -e "const fs=require('fs'); const keys=['GEMINI_API_KEY','AI_OPERATIONS_TOKEN']; const out={}; for (const key of keys) if (process.env[key]) out[key]=process.env[key]; fs.writeFileSync('.ai-secrets.json', JSON.stringify(out));"
          pnpm exec wrangler secret bulk .ai-secrets.json --config apps/ai-assistant/wrangler.production.json
      - name: Deploy storefront Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config apps/storefront/wrangler.production.json
      - name: Deploy admin Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy apps/admin/out --project-name="${AETHER_ADMIN_PAGES_PROJECT}" --branch=main
      - name: Verify public services
        run: |
          curl --fail --retry 3 --retry-delay 5 "${APP_ORIGIN_STORE}"
          curl --fail --retry 3 --retry-delay 5 "${NEXT_PUBLIC_AETHER_API_URL}/api/v1/health"
          curl --fail --retry 3 --retry-delay 5 "${NEXT_PUBLIC_AETHER_AI_URL}/healthz"
          curl --fail --retry 3 --retry-delay 5 "${APP_ORIGIN_ADMIN}"
          curl --fail --retry 3 --retry-delay 5 "${NEXT_PUBLIC_PORTFOLIO_URL}"
