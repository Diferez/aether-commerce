name: Publish Aether packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 8.15.9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@aether-commerce"
      - run: pnpm install --frozen-lockfile
      - name: Build workspace
        env:
          NEXT_PUBLIC_AETHER_API_URL: https://api.example.com
          NEXT_PUBLIC_AETHER_AI_URL: https://ai.example.com
          NEXT_PUBLIC_PORTFOLIO_URL: https://portfolio.example.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: pnpm build
      - run: pnpm test:client-template
      - name: Verify package archives
        if: ${{ inputs.dry_run }}
        run: pnpm --recursive --filter "./packages/*" pack --pack-destination "${{ runner.temp }}/aether-packages"
      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        run: pnpm publish:packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
