[project]
name = "aether-ai-assistant"
version = "0.1.0"
description = "Aether sales assistant service powered by FastAPI, LangGraph and Gemini."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic",
  "pydantic-settings",
  "httpx",
  "python-json-logger",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation-fastapi"
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
  "respx>=0.21.1",
]

[project.scripts]
aether-ai-migrate = "app.migrate:run_migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
