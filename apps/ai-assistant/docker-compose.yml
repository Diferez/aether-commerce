services:
  assistant:
    build: .
    ports:
      - "8090:8090"
    environment:
      AETHER_API_BASE_URL: "http://host.docker.internal:8787"
      AETHER_CART_TOKEN_SECRET: "local-dev-cart-token-secret"
      DATABASE_URL: "postgresql://aether:aether@postgres:5432/aether_ai"
      REDIS_URL: "redis://redis:6379/0"
      AI_ASSISTANT_ENABLED: "true"
      AI_MUTATIONS_ENABLED: "true"
      AI_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
      AI_MAX_INPUT_CHARACTERS: "4000"
      AI_RUN_MIGRATIONS_ON_STARTUP: "true"
      GEMINI_API_KEY: ""
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "aether"
      POSTGRES_PASSWORD: "aether"
      POSTGRES_DB: "aether_ai"
    ports:
      - "54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "63791:6379"
